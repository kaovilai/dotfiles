# Battery gauge is miscalibrated: hardware cuts power at a reported 17%, so the
# usable range is 17-100%. Treat ~21% as the effective empty point so UPower
# shuts down cleanly with a margin before the sudden cutoff.
[UPower]
UsePercentageForPolicy=true
PercentageLow=30.0
PercentageCritical=25.0
PercentageAction=21.0
