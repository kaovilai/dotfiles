# Dependabot configuration.
#
# Scope: the only dependency manifests in this repo are the Go modules behind
# the launchers: the optional Go proxy (`scripts/hosted-only-go/go.mod`) and
# the claude-provider bridge (`scripts/claude-provider-go/go.mod`). Both are
# stdlib-only today; Dependabot security updates are enabled on the
# repository, so a vulnerable Go module version now produces a security PR as
# well as a version-bump PR.
#
# GitHub Actions are intentionally not listed here: almost every `uses:` line
# lives in `*.lock.yml` files generated by `gh aw compile`. A Dependabot bump of
# a generated lock would be reverted by the next compile and can desync the
# lock from its `.md` source. Update those through the gh-aw tooling instead
# (`gh aw upgrade`, then `gh aw compile`).
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/scripts/hosted-only-go"
    schedule:
      interval: weekly
      day: monday
      time: "06:07"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(go)"
    # Minor and patch bumps arrive as one PR; majors stay separate so the
    # build (and the stdlib/vuln check) gets a real review.
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: "/scripts/claude-provider-go"
    schedule:
      interval: weekly
      day: monday
      time: "06:12"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(go)"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
