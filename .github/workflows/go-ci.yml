name: Go CI

# The optional Go proxy (`scripts/hosted-only-go`) is a dependency of the
# launchers, so it gets the same treatment as the shell code: syntax/quality
# gates plus a vulnerability scan. govulncheck covers the module and the Go
# standard library (Dependabot's Go alerts only see module requirements).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hosted-only-go/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/hosted-only-go/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/hosted-only-go
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: scripts/hosted-only-go/go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
