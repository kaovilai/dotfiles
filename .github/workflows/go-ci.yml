name: Go CI

# The Go modules under scripts/ are dependencies of the launchers (the
# hosted-only proxy and the claude-provider bridge T3 threads run resident),
# so they get the same treatment as the shell code: syntax/quality gates plus
# a vulnerability scan. govulncheck covers the modules and the Go standard
# library (Dependabot's Go alerts only see module requirements).
#
# The build matrix covers `stable` and the version declared in go.mod: the
# launchers build with whatever `go` is installed, so code that needs a newer
# toolchain must fail here, not in the shell.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/hosted-only-go/**"
      - "scripts/claude-provider-go/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/hosted-only-go/**"
      - "scripts/claude-provider-go/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, "1.21"]
        module: [scripts/hosted-only-go, scripts/claude-provider-go]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No later step needs authenticated Git access.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: govulncheck
        if: matrix.go == 'stable'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
